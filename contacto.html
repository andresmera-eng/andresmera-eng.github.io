<body>
    <div class="container">
        
        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <main class="main-content">
            <section class="page-section">
                
                <!-- Título -->
                <h2 class="page-title">Contacto</h2>
                
                <!-- === MENSAJE DE BIENVENIDA === -->
                <div class="contact-intro">
                    <p>
                        ¿Hablamos? Estoy abierto a colaboraciones, procesos de selección
                        y proyectos interesantes. ¡Escríbeme!
                    </p>
                </div>
                
                <!-- === FILA: FORMULARIO + ENLACES === -->
                <div class="contact-row">
                    
                    <!-- Columna izquierda: Formulario -->
                    <div class="contact-form-wrapper">
                        <!-- mailto: abre el cliente de correo con los datos prellenados -->
                        <form id="contactForm" class="contact-form" action="mailto:andresfe_mera@hotmail.com" method="POST" enctype="text/plain">
                            <div class="form-group">
                                <label for="name">Nombre</label>
                                <input type="text" id="name" name="name" placeholder="Tu nombre" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="subject">Asunto</label>
                                <input type="text" id="subject" name="subject" placeholder="¿Sobre qué quieres hablar?">
                            </div>
                            
                            <div class="form-group">
                                <label for="message">Mensaje</label>
                                <textarea id="message" name="message" rows="5" placeholder="Cuéntame más..." required></textarea>
                            </div>
                            
                            <button type="submit" class="btn-primary">
                                Enviar mensaje →
                            </button>
                        </form>
                    </div>
                    
                    <!-- Columna derecha: Enlaces -->
                    <div class="contact-links-wrapper">
                        <h4>Encuéntrame también en</h4>
                        
                        <div class="contact-links">
                            <a href="mailto:andresfe_mera@hotmail.com" class="contact-link" target="_blank">
                                <span class="contact-icon">📧</span>
                                <span class="contact-label">Outlook</span>
                            </a>
                            
                            <a href="https://www.linkedin.com/in/andres-felipe-mera-martinez-dev/" class="contact-link" target="_blank">
                                <span class="contact-icon">💼</span>
                                <span class="contact-label">LinkedIn</span>
                            </a>
                            
                            <a href="https://github.com/andresmera-eng" class="contact-link" target="_blank">
                                <span class="contact-icon">🐙</span>
                                <span class="contact-label">GitHub</span>
                            </a>
                            
                            <a href="https://andres-mera.itch.io/" class="contact-link" target="_blank">
                                <span class="contact-icon">🎮</span>
                                <span class="contact-label">Itch.io</span>
                            </a>
                            
                            <!--
                            <a href="https://play.google.com/store/apps/dev?id=..." class="contact-link" target="_blank">
                                <span class="contact-icon">📱</span>
                                <span class="contact-label">Google Play</span>
                            </a>
                            -->
                        </div>
                    </div>
                    
                </div>
                
            </section>
        </main>
